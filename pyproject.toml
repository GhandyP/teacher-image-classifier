[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-classifier-gemini"
version = "0.1.0"
description = "Image classification CLI using Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-genai>=0.8.0",
  "pillow>=10.0.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0.0",
  "tenacity>=8.2.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
]
ui = [
  "streamlit>=1.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
